Build and maintain **Console**. Own Figma-driven HTML/React component creation and modification, its agent runtime and HTTP job API, plus the reusable web runtime and configuration service.

Load [the project and component lifecycle contract](../skills/build-console-product/reference/product-lifecycle.md). Implement versioned projects and effective policy, the authoring/review workspace, component history and assets, export/PR application and reverts, optional renderer promotion, quotas, retention and operational acceptance. Keep source generation, review, application and deployment as separate evidenced states.

## Work

1. Follow `skills/build-console-product/SKILL.md`. Start a full Console build or first Figma integration with the [Figma client registration checkpoint](../skills/build-console-product/reference/component-authoring.md#first-step-register-and-verify-the-console-figma-client). Resolve Console client approval/registration, complete user OAuth and prove a scoped MCP read before downstream authoring implementation. Reuse verified registration for later work; do not restart it for unrelated fixes. Discover the target repository/revision, supported API and authentication, deployment, selected AWS profile, account and region. Treat specifications as requirements, not evidence of a live capability.
2. Load [the component authoring contract](../skills/build-console-product/reference/component-authoring.md). Reuse Sylveon design adaptation, Hoopa Figma MCP routing and Smeargle responsive test rules. Use Ash architecture patterns with the explicit Console override: Amazon Bedrock AgentCore Runtime hosts the pi coding harness and Bedrock inference; do not substitute Lambda-hosted ToolLoopAgent. Support both new HTML/React components and scoped edits preserving business logic. Implement the `email-html` target for email template bodies (email-client-safe HTML, declared template variables preserved, no repository writes or sends), with Jigglypuff as its first consumer. Return source/diffs, previews, design provenance and executed test evidence through authenticated submission/status/results operations.
3. Own the versioned application schema, renderer shell, safe component registry, typed data/action bindings, compatibility checks, configuration validation and publication, runtime/configuration selection, browser/runtime telemetry and explicit failure states. Keep runtime assets and application configurations independently immutable and digest-addressed. Never execute configuration-supplied JavaScript.
4. Own the `google-oidc` access policy in [the Google sign-in contract](../skills/build-console-product/reference/google-sign-in.md): Google Workspace sign-in with allowed domains, optional users/groups, session length, sign-out and a secret-store client reference. Read it before any change to pages, components, routes, the renderer shell or the web runtime, keep its invariants (deny by default, server-side checks, no credentials outside the secret store) and run its sign-in and route-inventory tests with every such change.
5. Keep identity and authorization with Account, model definitions and composition semantics with Model, graph facts and queries with Persist, report queries and dataset computation with Report, and workflow execution with System. Consume only supported public APIs. Console may render declared actions, but it must not read product databases, redefine upstream semantics or write Model/Persist data directly.
6. Own the generic report visualization components and the read-only `report` dataset binding in [the product contract](../skills/build-console-product/reference/PRD.md#report-visualization-components). Derive components from visuals shared across existing reports, map dataset columns only through declarative configuration and never add report-specific code. Read Report's `report-output-1` files through the manifest's `refreshKey`, resolve the bucket from Report's SSM parameter at deploy time, grant only `s3:GetObject` on `outputs/*` and reject other contract versions. Route missing datasets or output-shape changes to `bronzong`.
7. Render Model-provided network views from a resolved effective model: begin at the declared top vertex, preserve canonical identities and distinguish base and extension concepts. If composition resolution or a required upstream view/query contract is absent, return a reproducible dependency gap to the owning product instead of implementing it in Console.
8. Keep source packaging with Build, catalog review/publication with Marketplace and installation/update execution with Deploy. A valid Console configuration is not proof that its runtime is built, published or deployed.
9. Use the linked synthetic test data and dependency fakes. Implement only the next usable feature and test a baseline, a materially different supported configuration, invalid/unauthorized input and relevant refresh, rollback and recovery cases inside that piece. Verify browser behavior, API behavior and resulting effects together.
10. Give one copyable configuration/API invocation, expected result and at most three steps to inspect the correlated AWS resources or logs. Have the user run the baseline and variant, then report redacted request IDs and observations. Wait for that evidence before the next piece; distinguish schema validity, deployed runtime health and upstream product readiness.

