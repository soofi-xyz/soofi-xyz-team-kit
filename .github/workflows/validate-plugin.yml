name: Validate Plugin

on:
  pull_request:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate plugin manifests and content
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.18"

      - name: Install validation dependencies
        run: python -m pip install -r skills/validate-transform-configuration/scripts/requirements-silvally.txt

      - name: Check shell scripts
        run: |
          bash -n scripts/sync-copilot-agents.sh
          bash -n scripts/sync-claude-agents.sh
          bash -n scripts/validate-plugin.sh
          bash -n scripts/sync-enact-schema.sh
          bash -n scripts/local-cursor-plugin.sh

      - name: Check Python syntax
        run: |
          python3 -m py_compile skills/validate-transform-configuration/scripts/resolve-transform-intent.py
          python3 -m py_compile skills/validate-transform-configuration/scripts/silvally_io.py
          python3 -m py_compile skills/validate-transform-configuration/scripts/fetch_validation_inputs.py
          python3 -m py_compile skills/validate-transform-configuration/scripts/transform_runs.py
          python3 -m py_compile skills/validate-transform-configuration/scripts/compare_datasets.py
          python3 -m py_compile skills/validate-transform-configuration/scripts/prod_actuals.py
          python3 -m py_compile skills/validate-transform-configuration/scripts/iceberg_snapshot_read.py
          python3 -m py_compile skills/validate-transform-configuration/scripts/build_run_package.py
          python3 -m py_compile skills/validate-transform-configuration/scripts/evaluate_run.py
          python3 -m py_compile skills/validate-transform-configuration/scripts/stage_evidence_package.py
          python3 -m py_compile skills/validate-transform-configuration/scripts/source_window.py
          python3 -m py_compile skills/validate-transform-configuration/scripts/graph_inputs.py
          python3 -m py_compile skills/validate-transform-configuration/scripts/run_workspace.py
          python3 -m py_compile skills/validate-transform-configuration/scripts/dev_redeploy.py
          python3 -m py_compile skills/validate-transform-configuration/scripts/catalog_expressions.py
          python3 -m py_compile skills/validate-transform-configuration/scripts/source_events.py
          python3 -m py_compile skills/validate-transform-configuration/scripts/chain_runs.py
          python3 -m py_compile scripts/test-silvally-tools.py
          python3 -m py_compile skills/configure-transform-product/scripts/transform_api.py
          python3 -m py_compile scripts/test-transform-api.py
          python3 -m py_compile scripts/check-system-manifest.py
          python3 -m py_compile scripts/test-build-system-product-contract.py
          python3 -m py_compile scripts/test-model-kpi-contract.py
          python3 -m py_compile scripts/test-enact-packaging.py
          node --check scripts/sync-enact-agents.mjs

      - name: Test agent memory hooks
        run: node --test hooks/agent-memory/test/memory.test.mjs hooks/agent-memory/test/release.test.mjs

      - name: Check Enact test data
        run: node scripts/run-enact-tests.mjs --dry-run

      - name: Validate plugin files
        run: scripts/validate-plugin.sh

      - name: Package Enact agents
        run: node scripts/sync-enact-agents.mjs sync

      - name: Check Enact packaging (T1; wave 1a must pass)
        run: python3 scripts/test-enact-packaging.py

      - name: Report Enact packaging for every agent (T1, report-only)
        continue-on-error: true
        run: python3 scripts/test-enact-packaging.py --strict

      - name: Check build-portals contract
        run: python3 scripts/test-build-portals-contract.py

      - name: Check System composition manifests
        run: python3 scripts/check-system-manifest.py

      - name: Check build-system-product contract
        run: python3 scripts/test-build-system-product-contract.py

      - name: Check product ownership and guided acceptance
        run: |
          python3 scripts/test-product-catalog.py
          python3 scripts/test-system-acceptance.py

      - name: Check Hoopa sanitization heuristics
        run: python3 scripts/check-build-portals-sanitization.py

      - name: Check generated Copilot agents are committed
        run: scripts/sync-copilot-agents.sh check

      - name: Check diff hygiene
        run: git diff --check
