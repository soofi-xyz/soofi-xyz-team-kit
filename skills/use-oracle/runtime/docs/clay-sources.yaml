  identifier_proven: true
  identifier_name: Parcel ID
  identifier_format: Hyphenated text in the form NN-NN-NN-NNNNNN-NNN-NN
  join_rule: Preserve the seed parcel_id as exact hyphenated text without numeric coercion and send it unchanged as the qPublic KeyValue.
  appraisal_source:
    official_office: https://www.ccpao.com/
    official_property_search: https://qpublic.schneidercorp.com/Application.aspx?AppID=830&LayerID=15008&PageTypeID=2&PageID=6754
    property_details: https://qpublic.schneidercorp.com/Application.aspx
    official_active_roll: https://www.ccpao.com/parcel-information/
    target_adapter: clay-qpublic-beacon-v1
    request_method: GET
    request_contract: AppID=830, LayerID=15008, PageTypeID=4, PageID=6754, and KeyValue equal to the exact hyphenated parcel_id
    expected_response: qPublic Beacon property-detail HTML containing the parcel summary, Buildings section, sales grid, and valuation grid used by the pinned transforms
    plain_http_probe: 403 Cloudflare managed challenge with cf-mitigated=challenge from non-US operator egress
    server_side_cloud_probe: Enable JavaScript and cookies to continue challenge
    aws_batch_egress: unproven; no AWS job was submitted or deployed in this preparation task
  count_evidence:
    assessed_projection: https://www.edr.state.fl.us/Content/conferences/advalorem/adval_parcelcounts.pdf
    projection_categories_2026: "AG 832 + HX 60346 + NRES 5611 + RES 38640 = 105429"
    active_assessment_roll: https://www.ccpao.com/parcel-information/
    gis_layer: https://gis.floridahealth.gov/server/rest/services/EHWATER/Parcels/MapServer/9
    gis_count_query: "where=1%3D1&returnCountOnly=true&f=json"

