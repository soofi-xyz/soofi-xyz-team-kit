runner_handoff:
  blockers:
    - Parameterize Lake-only county, FIPS, adapter, transform path, source validator, request schema, S3 keys, handoff names, and runtime-source digest.
    - Replace the stale seed /search/real-property/{ALTKEY} URL with the reviewed /parcel/summary/?altkey={ALTKEY} request contract.
    - Add a browser-capable container path that clicks #acceptDataDisclaimer; the current appraisal image contains neither Chrome nor Puppeteer.
    - Keep seven-digit ALTKEY request_identifier separate from the twelve-digit Parcel ID emitted by the detail page.
    - Synthesize data/parcel.json or fix the upstream Volusia extractor before applying the current Lake output validator.
    - Decide whether to supply input.csv parcel_polygon; the current runner writes seed.csv while the Volusia extractor looks for input.csv and its maps5 geometry fallback is unavailable.
    - Preserve supplied elephant_uuid and elephant_token as opaque authoritative values; validation must not remint or rewrite them.
    - Run an actual AWS Batch browser smoke and a diverse 10-20 parcel transform coverage suite before scale-out.

