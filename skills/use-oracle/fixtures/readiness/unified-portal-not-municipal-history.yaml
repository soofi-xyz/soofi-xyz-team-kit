# Failure mode: a county one-stop or application portal is not municipal permit history.
# Distilled from a 2026 ingest that treated a central e-permits portal as complete
# coverage. Apply to every county.
county: Example
state: FL
slug: example-onestop
fips: "12000"
snapshot_time: "2026-01-01T00:00:00Z"
parcel:
  canonical_source: tax_roll
  gis_feature_count: 1000
  assessed_parcel_count: 1000
  discrepancy_threshold_pct: 2.0
  identifier_proven: true
permits:
  expected_jurisdiction_count: 2
  assumes_unified_countywide_history: true
  jurisdictions:
    - jurisdiction: unincorporated
      status: supported
      vendor: onestop
      portal_kind: central-submission
      historical_records: true
    - jurisdiction: Example City
      status: supported
      vendor: onestop
      portal_kind: central-submission
      historical_records: true
destination:
  writes_in_scope: true
  proven: true
  project: elephant-pipeline
  environment: non-production
  independent_identity_sources:
    - neon_console_project_and_branch
    - configured_branch_and_endpoint_ids
approved_exceptions: []
