name: Publish to Prism Marketplace
description: >
  Publish the pushed commit of a product repository to Prism Marketplace with a
  bundle built by the Build service: security scan, Build, Marketplace upload
  and review (skills/operate-marketplace/scripts/publish_via_build.py).
  Needs a checkout with full history (fetch-depth 0) and only
  MARKETPLACE_API_KEY.

inputs:
  marketplace_api_key:
    description: Prism Marketplace x-api-key; Build accepts the same key.
    required: true
  branch:
    description: Remote branch the commit must be on.
    required: false
    default: ${{ github.ref_name }}
  ref:
    description: Commit to publish.
    required: false
    default: ${{ github.sha }}
  product_name:
    description: "Marketplace product name (default: the manifest's component_name)."
    required: false
    default: ""
  dry_run:
    description: "true stops before any Marketplace call."
    required: false
    default: "false"
  build_timeout_seconds:
    description: Build poll timeout.
    required: false
    default: "1200"
  review_timeout_seconds:
    description: Marketplace review poll timeout.
    required: false
    default: "2400"

outputs:
  build_id:
    description: Build service build id.
    value: ${{ steps.publish.outputs.build_id }}
  review_id:
    description: Marketplace review id.
    value: ${{ steps.publish.outputs.review_id }}
  review_status:
    description: Marketplace review status (SUCCEEDED or FAILED).
    value: ${{ steps.publish.outputs.review_status }}
  bundle_id:
    description: Marketplace bundle id after a successful review.
    value: ${{ steps.publish.outputs.bundle_id }}

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: 22

    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Enable corepack
      shell: bash
      run: corepack enable

    - name: Publish through Build
      id: publish
      shell: bash
      env:
        MARKETPLACE_API_KEY: ${{ inputs.marketplace_api_key }}
        MARKETPLACE_PRODUCT_NAME: ${{ inputs.product_name }}
        DRY_RUN: ${{ inputs.dry_run == 'true' && '1' || '' }}
        BUILD_TIMEOUT_SECONDS: ${{ inputs.build_timeout_seconds }}
        MARKETPLACE_REVIEW_TIMEOUT_SECONDS: ${{ inputs.review_timeout_seconds }}
        PUBLISH_BRANCH: ${{ inputs.branch }}
        PUBLISH_REF: ${{ inputs.ref }}
        SCRIPT: ${{ github.action_path }}/../../skills/operate-marketplace/scripts/publish_via_build.py
      run: |
        set +x
        [ -n "$MARKETPLACE_PRODUCT_NAME" ] || unset MARKETPLACE_PRODUCT_NAME
        report="$RUNNER_TEMP/publish-report.json"
        set +e
        python3 "$SCRIPT" "$GITHUB_WORKSPACE" --branch "$PUBLISH_BRANCH" --ref "$PUBLISH_REF" \
          --work-dir "$RUNNER_TEMP/publish-via-build" >"$report"
        code=$?
        set -e
        python3 - "$report" <<'EOF'
        import json, os, sys
        report = json.load(open(sys.argv[1]))
        build = report.get("build") or {}
        publish = report.get("publish") or {}
        values = {
            "build_id": build.get("build_id") or "",
            "review_id": publish.get("review_id") or "",
            "review_status": publish.get("review_status") or "",
            "bundle_id": publish.get("bundle_id") or "",
        }
        with open(os.environ["GITHUB_OUTPUT"], "a") as out:
            for name, value in values.items():
                out.write(f"{name}={value}\n")
        scan = report.get("scan") or {}
        source = report.get("source") or {}
        rows = [
            ("Result", "ok" if report.get("ok") else f"stopped: {report.get('error', 'review did not succeed')}"),
            ("Dry run", str(report.get("dry_run", False)).lower()),
            ("Commit", source.get("commit", "")),
            ("Scan severity", scan.get("severity_label", "")),
            ("Build id", values["build_id"]),
            ("Stacks", ", ".join(build.get("cloudformation_stack_names") or [])),
            ("Review", f"{values['review_id']} {values['review_status']}".strip()),
            ("Bundle id", values["bundle_id"]),
        ]
        with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
            summary.write("### Publish to Prism Marketplace\n\n| | |\n| --- | --- |\n")
            for label, value in rows:
                summary.write(f"| {label} | {value} |\n")
        EOF
        cat "$report"
        exit $code
